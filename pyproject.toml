[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courtside"
version = "0.1.0"
description = "Paper-trade NBA player props and measure closing line value."
requires-python = ">=3.13,<3.14"
dependencies = [
  "nba_api",
  "pandas",
  "pyarrow",
  "duckdb",
  "lightgbm",
  "numpy",
  "scipy",
  "requests",
  "boto3",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
